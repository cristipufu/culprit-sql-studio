# cargo-deny: what the dependency graph may contain. CI runs `cargo deny check` on every push and pull request.

[graph]
# Every platform the desktop app and CLI ship on, with every feature, so a Windows- or Linux-only crate is judged too.
all-features = true

[advisories]
# Vulnerabilities, unsound code and unmaintained crates anywhere in the graph (cargo-deny reports unsound code only in
# direct dependencies by default), and yanked versions, fail the check, except the advisories below.
# Each is a crate this workspace doesn't depend on directly and that has no fixed release reachable from here; drop the
# entry when the crate that pulls it in moves on.
yanked = "deny"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 (unsound VariantStrIter, fixed in 0.20): Tauri's GTK3 stack on Linux pins it" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (unmaintained): a build-time macro dependency of glib 0.18 in Tauri's GTK3 stack" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant (unmaintained): keyring's Linux Secret Service backend, through zbus" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names (unmaintained): keyring's Linux Secret Service backend, through zbus" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (unmaintained): keyring's Linux Secret Service backend, through zbus" },
]

[licenses]
# Permissive licenses, and MPL-2.0 for the crates named below only, so a new MPL-2.0 crate fails the check until it is
# decided on here. dev/licenses.py ships the notices under the same list.
# - MPL-2.0 is file-level copyleft: changes to those crates' own files would have to be shared; they are used
#   unmodified. cssparser, cssparser-macros, selectors and dtoa-short are Tauri's HTML tooling, used at build time on
#   the platforms Culprit ships (wry uses them at run time only on Android). option-ext is a one-trait helper of dirs,
#   which finds the config, data, home and Downloads folders, and is in every binary.
# - CDLA-Permissive-2.0: webpki-roots and webpki-root-certs, Mozilla's root certificates as data.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
]
confidence-threshold = 0.93

[bans]
# Tauri brings several versions of some crates (windows-sys, syn); duplicates are reported, not failed.
multiple-versions = "warn"
# A dependency must name its versions. The workspace's own crates depend on each other by path without one, which is
# fine since none of them is published (`publish = false`).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
