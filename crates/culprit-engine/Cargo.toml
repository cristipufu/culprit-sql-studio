[package]
name = "culprit-engine"
description = "Culprit's engine: connection store, provider registry, scans and snapshot storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The files in tests/ are modules of one test binary, tests/all.rs.
autotests = false

[lib]
# Its doc comments hold no Rust examples: rustdoc would have nothing to test.
doctest = false

[features]
default = ["mssql", "postgres", "yugabyte", "mysql", "sqlite"]
mssql = ["dep:culprit-mssql"]
postgres = ["dep:culprit-postgres"]
yugabyte = ["dep:culprit-yugabyte"]
mysql = ["dep:culprit-mysql"]
sqlite = ["dep:culprit-sqlite"]
collector = ["dep:culprit-collector"]
store-adx = ["collector", "dep:culprit-store-adx", "dep:culprit-blob-azure"]
store-clickhouse = ["collector", "dep:culprit-store-clickhouse", "dep:culprit-blob-azure"]

# All of tests/ in one binary: each test binary is linked, and scanned on its first run, on its own.
[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
culprit-read.workspace = true
culprit-auth.workspace = true
culprit-auth-aws.workspace = true
culprit-auth-azure.workspace = true
async-trait.workspace = true
zeroize.workspace = true
culprit-core.workspace = true
culprit-collector = { workspace = true, optional = true }
culprit-store-adx = { workspace = true, optional = true }
culprit-blob-azure = { workspace = true, optional = true }
culprit-store-clickhouse = { workspace = true, optional = true }
culprit-checks.workspace = true
culprit-mssql = { workspace = true, optional = true }
culprit-postgres = { workspace = true, optional = true }
culprit-yugabyte = { workspace = true, optional = true }
culprit-mysql = { workspace = true, optional = true }
culprit-sqlite = { workspace = true, optional = true }
culprit-querylog.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
keyring.workspace = true
process-wrap.workspace = true
ring.workspace = true
roxmltree.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27"
tokio = { workspace = true, features = ["io-util"] }
toml.workspace = true
ts-rs.workspace = true
ureq.workspace = true

[dev-dependencies]
culprit-checks.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
