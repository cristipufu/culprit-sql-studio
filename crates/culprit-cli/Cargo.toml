[package]
name = "culprit-cli"
description = "culprit: find what is slowing your database down"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "culprit"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
culprit-auth.workspace = true
culprit-auth-azure.workspace = true
culprit-core.workspace = true
culprit-collector.workspace = true
culprit-engine = { workspace = true, features = ["store-adx", "store-clickhouse"] }
culprit-store-adx.workspace = true
culprit-store-clickhouse.workspace = true
culprit-mcp.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
ring.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
# Hides a typed password (console echo off), as `stty -echo` does on Unix.
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
