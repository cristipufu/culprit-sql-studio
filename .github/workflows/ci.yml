name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token, no secrets; third-party actions are pinned to commit SHAs (the comment says which tag).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tests never touch an OS keychain: secrets stay in memory.
  CULPRIT_KEYCHAIN: "off"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Catalog tooling and translation freshness
        run: |
          python3 -B -m unittest discover -s dev -p test_catalog.py
          python3 -B -m unittest discover -s dev -p test_smoke_providers.py
          python3 dev/catalog.py stale --check

  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The desktop app crate needs the frontend build and, on Linux, WebKitGTK; the `app` job covers it.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude culprit-app --all-targets -- -D warnings
      - name: Engine without bundled providers
        run: cargo clippy --locked -p culprit-engine --no-default-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --exclude culprit-app
      # The tests above regenerate app/src/gen from the Rust model: a difference means the committed contracts are stale,
      # even when the old TypeScript still compiles. Once is enough: the generated text doesn't depend on the OS.
      - name: Generated UI contracts match the Rust model
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git diff --exit-code -- app/src/gen
          untracked=$(git ls-files --others --exclude-standard -- app/src/gen)
          if [ -n "$untracked" ]; then
            echo "Generated but not committed:"
            echo "$untracked"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Typecheck, test and lint the UI
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run lint

  providers:
    name: Live provider (${{ matrix.fixture }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fixture: postgres, os: ubuntu-latest }
          - { fixture: mysql, os: ubuntu-latest }
          - { fixture: mariadb-10.6, os: ubuntu-latest }
          - { fixture: mariadb-10.11, os: ubuntu-latest }
          - { fixture: mariadb-11.8, os: ubuntu-latest }
          - { fixture: mssql, os: ubuntu-latest }
          # These fixture digests pin the native arm64 images used for provider verification.
          - { fixture: timescale, os: ubuntu-24.04-arm }
          - { fixture: yugabyte, os: ubuntu-24.04-arm }
          - { fixture: yugabyte-cluster, os: ubuntu-24.04-arm }
          - { fixture: ssh, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Collect, restrict permissions and verify cancellation in a disposable database
        run: python3 -B dev/smoke-providers.py ${{ matrix.fixture }}

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories, licenses, duplicate versions and sources, as deny.toml says.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Audit the UI's packages
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun audit
      # The third-party notices the release ships: a dependency whose license can't be read fails here, not on
      # release day.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/install-cargo-about
      - name: Write the third-party notices
        run: python3 dev/licenses.py

  e2e:
    name: Interface (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: UI packages and the browser
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps --only-shell chromium
      # The UI in a real browser against the demo: navigation, the editor, findings, schema and plans by keyboard.
      - name: Interaction tests
        working-directory: app
        run: bun run e2e
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: app/test-results/
          retention-days: 7

  coverage:
    name: Coverage
    # Measures, doesn't gate: the table goes to the run's summary, the LCOV reports to an artifact. On pushes to main,
    # so pull requests don't wait for an instrumented build.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
          workspaces: ". -> target/coverage"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: UI packages
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Measure
        run: |
          python3 dev/coverage.py
          cat target/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            target/coverage/rust.lcov
            target/coverage/ui/lcov.info
            target/coverage/summary.md
          retention-days: 14

  app:
    name: Desktop app (${{ matrix.os }})
    needs: [fmt, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build the UI
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build
      # Languages are compiled into the app, never read from disk: every locales/*.json and its keys are in the bundle.
      - name: Every language is inside the built UI
        working-directory: app
        run: bun scripts/check-bundled-locales.ts
      - name: Clippy (desktop app)
        run: cargo clippy --locked -p culprit-app --all-targets -- -D warnings
      # The workspace tests leave the desktop crate out; its own run here, on each platform it ships for.
      - name: Test (desktop app)
        run: cargo test --locked -p culprit-app --lib
      # Unsigned: no certificates or notarization secrets in CI. Local signed builds use dev/build-local.sh.
      - name: Bundle
        working-directory: app
        run: bunx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: culprit-${{ runner.os }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 14
